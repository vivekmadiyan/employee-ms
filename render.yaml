services:
  - type: web
    name: employeems-api
    env: node
    region: oregon
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://employee-ms-rho-sepia.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://employee-ms-rho-sepia.vercel.app
      - key: PGSSL
        value: true
      - key: TRUST_PROXY
        value: true
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: EmployeeMS
