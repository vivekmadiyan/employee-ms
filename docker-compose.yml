services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-employee_management_system}
      POSTGRES_USER: ${POSTGRES_USER:-employeems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-employeems}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-employee_management_system}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      ALLOWED_ORIGINS: ${CLIENT_URL:-http://localhost}
      TRUST_PROXY: 'true'
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: .
    depends_on: [api]
    ports: ['80:80']
    restart: unless-stopped

volumes:
  postgres_data:
